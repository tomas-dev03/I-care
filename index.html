    var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
    var KEY = 'icare-preview-key';

    function show(key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data)).then(function (buf) {
        var html = new TextDecoder().decode(buf);
        // document.open solo reemplaza la página si esta ya terminó de cargar
        var write = function () { document.open(); document.write(html); document.close(); };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', write);
        else write();
      });
    }
    function derive(pw) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iterations, hash: 'SHA-256' },

      });
    }

    // Si ya se entró en esta pestaña, no se vuelve a pedir la contraseña
    var saved = null;
    try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    if (saved) {
      document.documentElement.style.visibility = 'hidden';   // evita ver el formulario un instante
      crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']).then(show)
        .catch(function () {
          try { sessionStorage.removeItem(KEY); } catch (e) {}
          document.documentElement.style.visibility = '';
        });
    }

    var form = document.getElementById('gate'), err = document.getElementById('err'), btn = form.querySelector('button');
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      err.textContent = ''; btn.disabled = true; btn.textContent = 'Checking…';
      var k;
      derive(document.getElementById('pw').value).then(function (key) { k = key; return show(key); }).then(function () {
